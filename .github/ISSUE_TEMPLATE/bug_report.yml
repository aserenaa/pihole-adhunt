name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste HAR files, Pi-hole passwords, query logs, IP addresses or hostnames from your network.**
        Replace real domains you'd rather not share with `example.com`. Security issues go through [private reporting](https://github.com/aserenaa/adhunt/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, what you expected, and what you got (error messages included).
      placeholder: |
        adhunt https://news.example.com --mobile
        Expected … but got …
    validations:
      required: true
  - type: input
    id: adhunt
    attributes:
      label: adhunt commit
      description: Output of `git rev-parse --short HEAD` in your clone.
    validations:
      required: true
  - type: input
    id: pihole
    attributes:
      label: Pi-hole version
      description: Settings → System, for example `FTL v6.2`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser used for scanning
      options: [Google Chrome, Microsoft Edge, Playwright Chromium, Not relevant (HAR or device mode)]
